th{

td{padding:6px 8px; border-bottom:1px solid #f0efe9; vertical-align:top;}
tr:hover td{background:#faf9f6;}
.row-hidden{display:none;}
.empty-msg{color:var(--muted); font-size:.82rem; padding:20px 4px; display:none;}
</style>

function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

GROUPS.forEach((g, gi) => {
  const det = document.createElement('details');
  det.className = 'group';
  det.dataset.idx = gi;
  const sum = document.createElement('summary');
  sum.innerHTML = `<span>${esc(g.bairro)}</span><span class="n">${g.itens.length}</span>`;
  det.appendChild(sum);

  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Nome</th><th>Endereço</th><th>CPF</th><th>Telefone</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  g.itens.forEach(it => {
    const tr = document.createElement('tr');
    const endereco = esc(it.rua) + (it.numero ? ', ' + esc(it.numero) : '');
    tr.innerHTML = `<td>${esc(it.nome) || '—'}</td><td>${endereco || '—'}</td><td>${esc(it.cpf) || '—'}</td><td>${esc(it.telefone) || '—'}</td>`;
    tr.dataset.hay = (it.nome + ' ' + it.rua + ' ' + g.bairro + ' ' + it.cpf + ' ' + it.telefone).toLowerCase();
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  det.appendChild(table);
  main.appendChild(det);
});

const searchEl = document.getElementById('search');
const emptyMsg = document.getElementById('empty-msg');
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.group').forEach(det => {
    let groupHasMatch = false;
    det.querySelectorAll('tbody tr').forEach(tr => {
      const match = q === '' || tr.dataset.hay.includes(q);
      tr.classList.toggle('row-hidden', !match);
      if (match) groupHasMatch = true;
    });
    det.style.display = groupHasMatch ? '' : 'none';
    if (groupHasMatch) anyVisible = true;
    if (q !== '' && groupHasMatch) det.open = true;
    if (q === '') det.open = false;
  });
  emptyMsg.style.display = anyVisible ? 'none' : 'block';
});
</script>
</body>
</html>
